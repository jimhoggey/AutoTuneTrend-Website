<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AutoTune Trend</title>
<style>
  :root{
    --bg:#0d0d10; --line:#1d1d24; --ink:#e8e8ee; --dim:#8a8a96;
    --orange:#ff7a1a; --red:#ff3b3b;
    --slotw:84px; --rowh:64px; --pps:20; --tlw:600px;
  }
  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  header{padding:10px 14px 6px; flex:none;}
  header h1{font-size:17px; font-weight:700; letter-spacing:.5px;}
  header p{font-size:12px; color:var(--dim);}
  #err{
    display:none; margin:6px 14px 0; padding:8px 12px; border-radius:8px;
    background:#3a1518; color:#ffb4b4; font-size:13px; flex:none;
  }
  #scroller{flex:1; overflow:auto; position:relative; overscroll-behavior:contain;}
  #content{position:relative; width:max-content; min-width:100%;}

  /* timeline ruler */
  #ruler{
    position:relative; height:22px; margin-left:var(--slotw); width:var(--tlw);
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  #ruler .tick{position:absolute; bottom:0; width:1px; height:6px; background:#333340;}
  #ruler .tick.maj{height:11px; background:#4a4a58;}
  #ruler .num{position:absolute; top:1px; font-size:9px; color:var(--dim); transform:translateX(2px);}

  /* track rows */
  .row{display:flex; height:var(--rowh); border-bottom:1px solid var(--line);}
  .slotcol{
    position:sticky; left:0; z-index:3; flex:none; width:var(--slotw);
    display:flex; align-items:center; gap:5px; padding-left:8px;
    background:var(--bg); border-right:1px solid var(--line);
  }
  .slot{
    width:56px; height:56px; flex:none; border-radius:50%; border:2px solid #2a2a33;
    background:#16161c; color:var(--ink); padding:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;
  }
  .slot img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .slot .dot{width:22px; height:22px; border-radius:50%; background:var(--red); pointer-events:none;}
  .slot.recording{border-color:var(--red); animation:pulse .9s ease-in-out infinite;}
  .slot.recording .dot{border-radius:5px;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,59,.55);}50%{box-shadow:0 0 0 9px rgba(255,59,59,0);}}
  .mini{display:none; flex-direction:column; gap:6px;}
  .row.hastake .mini{display:flex;}
  .mini button{
    width:18px; height:18px; border-radius:50%; border:none; padding:0; cursor:pointer;
    background:#26262e; color:var(--dim); font-size:9px; line-height:18px;
  }
  .mini .rerec{color:var(--red);}
  .bslot{border-color:#4a2a10; color:var(--orange); font-size:22px;}

  .lane{position:relative; flex:none; width:var(--tlw); overflow:hidden;}
  .addback{
    position:absolute; left:8px; top:50%; transform:translateY(-50%);
    background:none; border:1px dashed #4a2a10; color:var(--orange);
    border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer;
  }
  .lane canvas.backwave{position:absolute; left:0; top:4px;}
  .secchip{
    position:absolute; top:2px; z-index:2; cursor:pointer;
    background:rgba(0,0,0,.65); border:1px solid rgba(255,122,26,.5); color:var(--orange);
    font-size:10px; line-height:1; padding:3px 7px; border-radius:8px;
  }

  .clip{
    position:absolute; top:4px; height:calc(var(--rowh) - 9px); border-radius:8px;
    overflow:hidden; cursor:grab; touch-action:none; border:1px solid;
  }
  .clip canvas{display:block;}

  #playhead{
    position:absolute; top:0; bottom:0; width:2px; background:#fff; z-index:2;
    pointer-events:none; box-shadow:0 0 6px rgba(255,255,255,.6);
  }

  .addrow{display:flex; height:44px; align-items:center;}
  #addTrack{
    position:sticky; left:8px; margin-left:8px; background:none; border:1px dashed #33333e;
    color:var(--dim); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer;
  }

  /* transport */
  #transport{
    flex:none; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:#111116;
  }
  .tline{display:flex; align-items:center; justify-content:center; gap:12px; width:100%;}
  #playBtn{
    flex:none; width:62px; height:62px; border-radius:50%; border:none; cursor:pointer;
    background:var(--ink); color:#111; font-size:24px;
  }
  #saveBtn,#vidBtn{
    flex:none; background:#22222b; color:var(--ink); border:1px solid #33333e; cursor:pointer;
    border-radius:10px; padding:12px 16px; font-size:15px; white-space:nowrap;
  }
  #saveBtn:disabled,#vidBtn:disabled,#playBtn:disabled{opacity:.4;}
  #phTime{font-size:12px; color:var(--dim); min-width:44px; font-variant-numeric:tabular-nums;}
  #backVolWrap{display:flex; align-items:center; gap:6px; color:var(--orange); font-size:14px;}
  #backVolSlider{width:90px; accent-color:var(--orange);}
  #vocVolWrap{display:flex; align-items:center; gap:6px; font-size:13px;}
  #vocVolSlider{width:90px; accent-color:var(--ink);}
</style>
</head>
<body>
<header>
  <h1>AutoTune Trend</h1>
  <p>sing badly. sound iconic. &nbsp;·&nbsp; 🎧 headphones recommended</p>
</header>
<div id="err"></div>

<div id="scroller">
  <div id="content">
    <div id="ruler"></div>
    <div id="rows"></div>
    <div class="addrow"><button id="addTrack">＋ add track</button></div>
    <div id="playhead"></div>
  </div>
</div>

<div id="transport">
  <div class="tline">
    <span id="backVolWrap">♫<input type="range" id="backVolSlider" min="0" max="120" value="40" aria-label="backing track volume"></span>
    <span id="vocVolWrap">🎤<input type="range" id="vocVolSlider" min="0" max="200" value="100" aria-label="vocal volume"></span>
  </div>
  <div class="tline">
    <span id="phTime">0.0s</span>
    <button id="playBtn" aria-label="play">▶</button>
    <button id="saveBtn">Save</button>
    <button id="vidBtn">🎬 Video</button>
  </div>
</div>

<input type="file" id="backFile" accept="audio/*" hidden>
<input type="file" id="faceFile" accept="image/*" capture="user" hidden>

<script>
'use strict';
/* ============================== state ============================== */
const PPS = 20;                 // pixels per second (fixed zoom)
const SLOT_W = 84;
const COLORS = ['#2ecc71','#a55eea','#22d3ee','#ffd93d','#ff6b81','#5eead4','#f4a261','#93c5fd'];
const $ = id => document.getElementById(id);

let AC = null;                  // shared AudioContext (created inside a tap)
let backing = null;             // AudioBuffer for the backing track
let tracks = [];                // {row, slot, lane, buf, start, color, img, clipEl}
let TL = 30;                    // timeline length in seconds
let ph = 0;                     // playhead position (seconds)
let playing = false, liveSrcs = [], phBase = 0, ctxT0 = 0, raf = 0;
let recState = null;            // {track, mr, stream, chunks, start}
let faceTarget = null;
let backVol = 0.4;              // backing track gain (slider-controlled)
let backGainNode = null;        // live backing GainNode while playing
let vocVol = 1.0;               // vocal clips gain (slider-controlled)
let vocGainNodes = [];          // live vocal GainNodes while playing
let wobbleStep = 0.15;          // sustain-wobble step (s), tempo-synced to the backing
window.__bpm = null;

function ensureCtx(){
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function showErr(msg){
  const e = $('err');
  e.textContent = msg; e.style.display = 'block';
  clearTimeout(showErr.t);
  showErr.t = setTimeout(() => e.style.display = 'none', 5000);
}
function mixDur(){
  let d = backing ? backing.duration : 0;
  for (const t of tracks) if (t.buf) d = Math.max(d, t.start + t.buf.duration);
  return d;
}

/* ============================ timeline ============================= */
function updateTL(){
  TL = Math.ceil(Math.max(30, mixDur()));
  document.documentElement.style.setProperty('--tlw', TL * PPS + 'px');
  const r = $('ruler');
  let html = '';
  for (let s = 0; s <= TL; s++){
    const maj = s % 5 === 0;
    html += `<div class="tick${maj ? ' maj' : ''}" style="left:${s * PPS}px"></div>`;
    if (maj) html += `<div class="num" style="left:${s * PPS}px">${s}</div>`;
  }
  r.innerHTML = html;
  if (backing) drawBacking();
}
function setPlayheadUI(){
  $('playhead').style.left = (SLOT_W + ph * PPS) + 'px';
  $('phTime').textContent = ph.toFixed(1) + 's';
}
function followScroll(){                 // keep the playhead in view
  const sc = $('scroller'), px = SLOT_W + ph * PPS;
  if (px > sc.scrollLeft + sc.clientWidth * 0.75 || px < sc.scrollLeft + SLOT_W)
    sc.scrollLeft = Math.max(0, px - sc.clientWidth * 0.35);
}
function seekTo(t){
  if (recState) return;
  t = Math.max(0, Math.min(TL, t));
  const wasPlaying = playing;
  if (playing) stopPlayback();
  ph = t; setPlayheadUI(); followScroll();
  if (wasPlaying) startPlayback();
}
$('ruler').addEventListener('click', e => {
  seekTo((e.clientX - $('ruler').getBoundingClientRect().left) / PPS);
});

/* =========================== waveforms ============================ */
function lighten(hex, amt){          // mix a hex color toward white
  const n = parseInt(hex.slice(1), 16);
  const c = i => Math.round(((n >> i) & 255) + (255 - ((n >> i) & 255)) * amt);
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}
function drawWave(cv, data, color, wPx, hPx){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(wPx * dpr));
  cv.height = Math.round(hPx * dpr);
  cv.style.width = wPx + 'px'; cv.style.height = hPx + 'px';
  const g = cv.getContext('2d');
  g.scale(dpr, dpr); g.fillStyle = color;
  const spp = data.length / wPx;
  for (let px = 0; px < wPx; px++){
    const a = Math.floor(px * spp), b = Math.min(data.length, Math.ceil((px + 1) * spp));
    const st = Math.max(1, Math.floor((b - a) / 32));
    let m = 0;
    for (let i = a; i < b; i += st){ const v = Math.abs(data[i]); if (v > m) m = v; }
    const amp = Math.max(0.6, m * (hPx / 2) * 0.95);
    g.fillRect(px, hPx / 2 - amp, 1, amp * 2);
  }
}

/* ========================= backing track ========================== */
const backRow = document.createElement('div');
backRow.className = 'row';
backRow.innerHTML = `
  <div class="slotcol"><button class="slot bslot" aria-label="backing track">♫</button></div>
  <div class="lane"><button class="addback">＋ add backing track</button></div>`;
$('rows').appendChild(backRow);
const backLane = backRow.querySelector('.lane');
backRow.querySelector('.addback').onclick = () => $('backFile').click();
backRow.querySelector('.bslot').onclick = () => $('backFile').click();

$('backFile').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const ab = await f.arrayBuffer();
    backing = await decode(ab);
    backLane.querySelector('.addback').style.display = 'none';
    updateTL();
    window.__sections = await detectSections(backing);
    renderSections();
    window.__bpm = await detectTempo(backing);
    wobbleStep = window.__bpm ? Math.min(0.25, Math.max(0.1, 30 / window.__bpm)) : 0.15;
  }catch(_){ showErr("couldn't read that audio file — try a different one"); }
};
async function detectTempo(buf){                         // eighth-note wobble sync
  const sr = buf.sampleRate, x = toMono(buf);
  const hop = 512, nE = Math.floor(Math.min(x.length, 60 * sr) / hop);
  const env = new Float32Array(nE);
  for (let i = 0; i < nE; i++){                          // onset envelope (RMS)
    let e = 0;
    const o = i * hop;
    for (let k = 0; k < hop; k++){ const v = x[o + k]; e += v * v; }
    env[i] = Math.sqrt(e / hop);
    if ((i & 511) === 511) await new Promise(r => setTimeout(r));
  }
  const d = new Float32Array(nE);
  for (let i = 1; i < nE; i++) d[i] = Math.max(0, env[i] - env[i - 1]);
  const fps = sr / hop;
  const minLag = Math.round(fps * 60 / 180), maxLag = Math.min(nE - 2, Math.round(fps));
  let best = 0, bl = 0;
  for (let lag = minLag; lag <= maxLag; lag++){
    let s = 0;
    for (let i = 0; i + lag < nE; i++) s += d[i] * d[i + lag];
    if (s > best){ best = s; bl = lag; }
  }
  return bl && best > 0 ? 60 * fps / bl : null;
}
function drawBacking(){
  let cv = backLane.querySelector('.backwave');
  if (!cv){
    cv = document.createElement('canvas');
    cv.className = 'backwave';
    backLane.appendChild(cv);
  }
  drawWave(cv, toMono(backing), getComputedStyle(document.documentElement)
    .getPropertyValue('--orange').trim() || '#ff7a1a',
    Math.round(backing.duration * PPS), 55);
}
const decode = ab => new Promise((res, rej) => AC.decodeAudioData(ab, res, rej));

/* ========================== vocal tracks ========================== */
function makeTrack(){
  const color = COLORS[tracks.length % COLORS.length];
  const row = document.createElement('div');
  row.className = 'row vocal';
  row.innerHTML = `
    <div class="slotcol">
      <button class="slot"><span class="dot"></span></button>
      <div class="mini">
        <button class="rerec" title="re-record">●</button>
        <button class="del" title="delete">✕</button>
      </div>
    </div>
    <div class="lane"></div>`;
  $('rows').appendChild(row);
  const t = { row, slot: row.querySelector('.slot'), lane: row.querySelector('.lane'),
              buf: null, start: 0, color, img: null, clipEl: null };
  t.slot.onclick = () => {
    ensureCtx();
    if (recState){ if (recState.track === t) stopRec(); return; }
    if (t.buf){ faceTarget = t; $('faceFile').click(); }
    else startRec(t);
  };
  row.querySelector('.rerec').onclick = () => {
    ensureCtx();
    if (recState) return;
    clearClip(t); startRec(t);
  };
  row.querySelector('.del').onclick = () => { if (!recState) clearClip(t); };
  tracks.push(t);
  return t;
}
function clearClip(t){
  if (t.clipEl) t.clipEl.remove();
  t.clipEl = null; t.buf = null; t.img = null;
  setTrackUI(t); updateTL();
}
function setTrackUI(t){
  t.row.classList.toggle('hastake', !!t.buf);
  if (t.buf){
    t.slot.innerHTML = t.img ? `<img src="${t.img}" alt="face">` : '📷';
  } else {
    t.slot.innerHTML = '<span class="dot"></span>';
  }
}
$('faceFile').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f && faceTarget){ faceTarget.img = URL.createObjectURL(f); setTrackUI(faceTarget); }
  faceTarget = null;
};
$('addTrack').onclick = () => makeTrack();
for (let i = 0; i < 4; i++) makeTrack();

function renderClip(t){
  if (t.clipEl) t.clipEl.remove();
  const el = document.createElement('div');
  el.className = 'clip';
  const w = Math.max(8, Math.round(t.buf.duration * PPS));
  el.style.left = t.start * PPS + 'px';
  el.style.width = w + 'px';
  el.style.background = t.color + '30';
  el.style.borderColor = t.color + '80';
  const cv = document.createElement('canvas');
  el.appendChild(cv);
  drawWave(cv, t.buf.getChannelData(0), lighten(t.color, 0.45), w, 54);
  t.lane.appendChild(el);
  t.clipEl = el;

  el.addEventListener('pointerdown', e => {           // horizontal drag to nudge
    if (recState) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const x0 = e.clientX, left0 = t.start * PPS;
    const move = ev => {
      const nl = Math.max(0, Math.min(TL * PPS - w, left0 + ev.clientX - x0));
      el.style.left = nl + 'px';
      t.start = nl / PPS;
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      updateTL();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}

/* =========================== recording ============================ */
async function startRec(track){
  if (exporting) return;                   // no recording while a video renders
  const c = ensureCtx();
  if (playing) stopPlayback();
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false }
    });
  }catch(_){
    showErr('mic access needed — allow the microphone and tap record again');
    return;
  }
  let mr;
  try{ mr = new MediaRecorder(stream); }
  catch(_){
    stream.getTracks().forEach(t => t.stop());
    showErr("recording isn't supported in this browser");
    return;
  }
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = finishRec;
  // live placeholder clip + mic level meter (analyser is never routed to output)
  const ghost = document.createElement('div');
  ghost.className = 'clip ghost';
  ghost.style.cssText = `left:${ph * PPS}px;width:2px;background:${track.color}18;` +
    `border:1px dashed ${track.color}66;pointer-events:none`;
  const level = document.createElement('div');
  level.style.cssText = 'position:absolute;left:0;width:100%;top:50%;' +
    `transform:translateY(-50%);height:0;background:${track.color}b3`;
  ghost.appendChild(level);
  track.lane.appendChild(ghost);
  const micSrc = c.createMediaStreamSource(stream);
  const analyser = c.createAnalyser();
  analyser.fftSize = 512;
  micSrc.connect(analyser);
  recState = { track, mr, stream, chunks, start: ph, ghost, level, micSrc, analyser,
               levelBuf: new Uint8Array(analyser.fftSize) };
  try{ mr.start(); }
  catch(_){
    ghost.remove();
    try{ micSrc.disconnect(); }catch(e2){}
    stream.getTracks().forEach(t => t.stop());
    recState = null;
    showErr("couldn't start recording — check the mic and try again");
    return;
  }
  track.slot.classList.add('recording');
  startPlayback();                         // hear the mix while singing
}
function stopRec(){
  if (!recState) return;
  stopPlayback();
  try{ recState.mr.stop(); }catch(_){ finishRec(); }
}
async function finishRec(){
  const rs = recState;
  recState = null;
  if (!rs) return;
  rs.ghost.remove();
  try{ rs.micSrc.disconnect(); }catch(_){}
  rs.stream.getTracks().forEach(t => t.stop());
  rs.track.slot.classList.remove('recording');
  updateTL();                              // settle any provisional extension
  ph = rs.start; setPlayheadUI();
  try{
    if (!rs.chunks.length) throw new Error('empty');
    const ab = await new Blob(rs.chunks).arrayBuffer();
    const raw = await decode(ab);          // container-agnostic (mp4 on iOS, webm on Chrome)
    // normalize the take in place so quiet mics feed the DSP a consistent level
    let pk = 0;
    for (let ch = 0; ch < raw.numberOfChannels; ch++){
      const dd = raw.getChannelData(ch);
      for (let i = 0; i < dd.length; i++){ const v = Math.abs(dd[i]); if (v > pk) pk = v; }
    }
    if (pk > 0.001){
      const gN = 0.95 / pk;
      for (let ch = 0; ch < raw.numberOfChannels; ch++){
        const dd = raw.getChannelData(ch);
        for (let i = 0; i < dd.length; i++) dd[i] *= gN;
      }
    }
    const tuned = await window.autotune(raw);
    rs.track.buf = tuned;
    rs.track.start = rs.start;
    setTrackUI(rs.track);
    updateTL();
    renderClip(rs.track);
  }catch(_){
    showErr("couldn't process that take — try recording again");
  }
}

/* ====================== playback / mix graph ====================== */
function buildGraph(c, dest, from){
  const master = c.createGain();
  master.gain.value = 0.9;
  const lim = c.createDynamicsCompressor();      // soft limiter
  lim.threshold.value = -10; lim.knee.value = 4; lim.ratio.value = 20;
  lim.attack.value = 0.003; lim.release.value = 0.25;
  master.connect(lim); lim.connect(dest);
  const srcs = [], t0 = c.currentTime;
  const add = (buf, at, off, gain) => {
    if (off >= buf.duration) return null;
    const s = c.createBufferSource(); s.buffer = buf;
    const g = c.createGain(); g.gain.value = gain;
    s.connect(g); g.connect(master);
    s.start(t0 + at, off);
    srcs.push(s);
    return g;
  };
  if (backing){
    const g = add(backing, 0, from, backVol);
    if (c === AC) backGainNode = g;                // live only, not offline renders
  }
  for (const t of tracks){
    if (!t.buf) continue;
    const g = t.start >= from ? add(t.buf, t.start - from, 0, vocVol)
                              : add(t.buf, 0, from - t.start, vocVol);
    if (g && c === AC) vocGainNodes.push(g);       // live only, not offline renders
  }
  return srcs;
}
function startPlayback(){
  const c = ensureCtx();
  liveSrcs = buildGraph(c, c.destination, ph);
  playing = true; phBase = ph; ctxT0 = c.currentTime;
  $('playBtn').textContent = '■';
  cancelAnimationFrame(raf);
  tick();
}
function tick(){
  raf = requestAnimationFrame(tick);
  ph = phBase + (AC.currentTime - ctxT0);
  if (!recState && ph >= mixDur()){ ph = mixDur(); stopPlayback(); return; }
  if (recState){
    recState.ghost.style.width = Math.max(2, (ph - recState.start) * PPS) + 'px';
    recState.analyser.getByteTimeDomainData(recState.levelBuf);
    let peak = 0;
    for (let i = 0; i < recState.levelBuf.length; i++){
      const v = Math.abs(recState.levelBuf[i] - 128);
      if (v > peak) peak = v;
    }
    recState.level.style.height = Math.round(peak / 128 * 55) + 'px';

/* ========================= autotune DSP =========================== */
function toMono(buf){
  if (buf.numberOfChannels === 1) return buf.getChannelData(0);
  const out = new Float32Array(buf.length), n = buf.numberOfChannels;
  for (let ch = 0; ch < n; ch++){
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) out[i] += d[i] / n;
  }
  return out;
}
function makeBuf(len, sr){
  return (AC || new OfflineAudioContext(1, 1, 44100)).createBuffer(1, len, sr);
}
const MAJOR = [0, 2, 4, 5, 7, 9, 11];

window.autotune = async function(inBuf){
  const sr = inBuf.sampleRate, x = toMono(inBuf);
  const N = 1024, H = 256;
  const nF = Math.max(1, Math.floor((x.length - N) / H) + 1);
  const minLag = Math.max(2, Math.floor(sr / 800));
  const maxLag = Math.min(N - 2, Math.ceil(sr / 70));
  const L = N - maxLag;                                  // correlation window

  /* 1 — pitch detection: normalized autocorrelation per frame */
  const f0 = new Float32Array(nF), en = new Float32Array(nF);
  for (let i = 0; i < nF; i++){
    const o = i * H;
    let e = 0;
    for (let n = 0; n < N; n++){ const v = x[o + n]; e += v * v; }
    const rms = Math.sqrt(e / N);
    en[i] = rms;
    const prevV = i > 0 && f0[i - 1] > 0;                // hysteresis: staying voiced
    if (rms < (prevV ? 0.001 : 0.002)) continue;         // needs less evidence
    let r0 = 0;
    for (let n = 0; n < L; n++){ const v = x[o + n]; r0 += v * v; }
    if (r0 < 1e-9) continue;
    const corr = lag => {
      let s = 0;
      for (let n = 0; n < L; n++) s += x[o + n] * x[o + n + lag];
      return s;
    };
    let best = 0, bl = 0;                                // coarse (step 3) then refine
    for (let lag = minLag; lag <= maxLag; lag += 3){
      const s = corr(lag);
      if (s > best){ best = s; bl = lag; }
    }
    for (let lag = Math.max(minLag, bl - 2); lag <= Math.min(maxLag, bl + 2); lag++){
      if (lag === bl) continue;
      const s = corr(lag);
      if (s > best){ best = s; bl = lag; }
    }
    // prefer the fundamental over lag multiples (octave-error correction)
    for (let guard = 0; guard < 4 && bl; guard++){
      let took = false;
      for (const div of [2, 3]){
        const cand = Math.round(bl / div);
        if (cand < minLag) continue;
        let cb = 0, cl = 0;
        for (let lag = cand - 2; lag <= cand + 2; lag++){
          if (lag < minLag) continue;
          const s = corr(lag);
          if (s > cb){ cb = s; cl = lag; }
        }
        if (cl && cb > 0.9 * best){ bl = cl; best = cb; took = true; break; }
      }
      if (!took) break;
    }
    // continuity-aware octave choice: consider {bl, bl/2, bl/3, 2bl}, bonus
    // candidates near the previous frame's pitch (prevents mid-note flips)
    if (bl){
      const cands = [{ lag: bl, score: best }];
      for (const g of [Math.round(bl / 2), Math.round(bl / 3), bl * 2]){
        if (g < minLag || g > maxLag) continue;
        let cb = 0, cl = 0;
        for (let lag = Math.max(minLag, g - 2); lag <= Math.min(maxLag, g + 2); lag++){
          const s = corr(lag);
          if (s > cb){ cb = s; cl = lag; }
        }
        if (cl && !cands.some(c => Math.abs(c.lag - cl) <= 2)) cands.push({ lag: cl, score: cb });
      }
      const prevF = i > 0 ? f0[i - 1] : 0;
      let eBest = -1, pickL = bl, pickS = best;
      for (const c of cands){
        let e = c.score * (c.lag > bl ? 0.95 : 1);        // slight fundamental bias
        if (prevF > 0 && Math.abs(12 * Math.log2(sr / c.lag / prevF)) <= 6) e *= 1.35;
        if (e > eBest){ eBest = e; pickL = c.lag; pickS = c.score; }
      }
      bl = pickL; best = pickS;
    }
    if (bl && best / r0 > (prevV ? 0.38 : 0.5)) f0[i] = sr / bl;   // voiced
  }

  /* 2 — MIDI + 5-wide median, octave de-glitch, short-gap fill */
  const f0raw = f0.slice();
  const f = new Float32Array(nF), midi = new Float32Array(nF);
  const m5 = [];
  for (let i = 0; i < nF; i++){
    m5.length = 0;
    for (let k = -2; k <= 2; k++) m5.push(f0[Math.min(nF - 1, Math.max(0, i + k))]);
    m5.sort((a, b) => a - b);
    f[i] = m5[2];
    midi[i] = f[i] > 0 ? 69 + 12 * Math.log2(f[i] / 440) : 0;
  }
  // octave de-glitch: pull ±12/±24 st outliers back toward the recent voiced pitch
  let lastM = 0, lastIdx = -100;
  for (let i = 0; i < nF; i++){
    if (midi[i] <= 0) continue;
    if (lastM > 0 && i - lastIdx <= 10 && Math.abs(midi[i] - lastM) >= 7){
      const dir = lastM > midi[i] ? 12 : -12;
      let fixed = false;
      for (let k = 1; k <= 2; k++){
        if (Math.abs(midi[i] + dir * k - lastM) <= 3.5){
          midi[i] += dir * k;
          f[i] = 440 * Math.pow(2, (midi[i] - 69) / 12);
          fixed = true;
          break;
        }
      }
      // not an octave error: an isolated outlier (blip/sibilance) — drop to unvoiced
      if (!fixed){ midi[i] = 0; f[i] = 0; continue; }
    }
    lastM = midi[i]; lastIdx = i;
  }
  // fill unvoiced gaps of <= 6 frames (~32 ms) between voiced neighbours (kills stutter)
  let gapsFilled = 0;
  for (let i = 1; i < nF; i++){
    if (midi[i] > 0 || midi[i - 1] <= 0) continue;
    let j = i;
    while (j < nF && midi[j] <= 0) j++;
    if (j < nF && j - i <= 6){
      for (let k = i; k < j; k++){
        midi[k] = midi[i - 1] + (midi[j] - midi[i - 1]) * (k - i + 1) / (j - i + 1);
        f[k] = 440 * Math.pow(2, (midi[k] - 69) / 12);
      }
      gapsFilled++;
    }
    i = j;
  }

  /* 3 — key auto-detect: energy-weighted pitch-class histogram, best major scale */
  const hist = new Float32Array(12);
  for (let i = 0; i < nF; i++)
    if (midi[i] > 0) hist[((Math.round(midi[i]) % 12) + 12) % 12] += en[i];
  let root = 0, bestScore = -1;
  for (let r = 0; r < 12; r++){
    let s = 0;
    for (const d of MAJOR) s += hist[(r + d) % 12];
    if (s > bestScore){ bestScore = s; root = r; }
  }
  const inScale = new Set(MAJOR.map(d => (root + d) % 12));

  /* 4 — exaggerate (2x around median) + hard-snap to nearest scale note */
  const voiced = [];
  for (let i = 0; i < nF; i++) if (midi[i] > 0) voiced.push(midi[i]);
  voiced.sort((a, b) => a - b);
  const med = voiced.length ? voiced[voiced.length >> 1] : 60;
  const fTarg = new Float32Array(nF);                    // 0 = unvoiced, pass through
  let clamped = 0;                                       // frames capped at ±1 octave
  const nearestScale = t => {
    let note = Math.round(t), bd = 1e9;
    for (let c = Math.floor(t) - 7; c <= Math.ceil(t) + 7; c++){
      if (!inScale.has(((c % 12) + 12) % 12)) continue;
      const d = Math.abs(c - t);
      if (d < bd){ bd = d; note = c; }
    }
    return note;
  };
  const tNote = new Int16Array(nF);
  let prevNote = 0, prevNoteIdx = -100;                  // note-switch hysteresis
  for (let i = 0; i < nF; i++){
    if (midi[i] <= 0) continue;
    if (i - prevNoteIdx > 7) prevNote = 0;               // genuinely new phrase: reset
    let target = med + 2.0 * (midi[i] - med);
    let note = nearestScale(target);                     // instant, zero portamento
    if (Math.abs(note - midi[i]) > 12){                  // cap the shift but stay on-grid
      target = midi[i] + (note > midi[i] ? 12 : -12);
      note = nearestScale(target);
      clamped++;
    }
    // note-switch hysteresis: hold the chosen note through vibrato-scale wobble;
    // a deliberate move (>= 1 st detected = 2 st in target space) still switches
    if (prevNote && Math.abs(target - prevNote) < 1.35) note = prevNote;
    tNote[i] = note;
    prevNote = note; prevNoteIdx = i;
    fTarg[i] = 440 * Math.pow(2, (note - 69) / 12);
  }

  /* 4b — sustain wobble: held notes glide melodically, short snaps stay instant */
  const degShift = (note, d) => {                        // move d scale positions
    let n = note;
    const step = d > 0 ? 1 : -1;
    for (let k = 0; k < Math.abs(d); k++)
      do { n += step; } while (!inScale.has(((n % 12) + 12) % 12));
    return n;
  };
  const holdFrames = Math.round(0.35 * sr / H);
  const period = Math.max(2, Math.round(wobbleStep * 2 * sr / H));   // one full up-down cycle
  let wobbledRuns = 0;
  for (let i = 0; i < nF; ){
    if (!(fTarg[i] > 0)){ i++; continue; }
    let j = i + 1;
    while (j < nF && fTarg[j] > 0 && tNote[j] === tNote[i]) j++;
    if (j - i > holdFrames){
      wobbledRuns++;                                     // sine glide, same audible rate
      const base = tNote[i];                             // as the old +2/-1-degree cycle
      const ampSt = (Math.abs(degShift(base, 2) - base) + Math.abs(degShift(base, -1) - base)) / 2;
      for (let k = i + holdFrames; k < j; k++){
        const phase = 2 * Math.PI * (k - i - holdFrames) / period;
        const targetMidi = base + ampSt * Math.sin(phase);   // continuous, not scale-snapped
        fTarg[k] = 440 * Math.pow(2, (targetMidi - 69) / 12);
      }
    }
    i = j;
  }

  /* 5 — granular overlap-add resynthesis (Hann, 75% overlap, formants shift) */
  const out = new Float32Array(x.length), norm = new Float32Array(x.length);
  const win = new Float32Array(N);
  for (let n = 0; n < N; n++) win[n] = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / N);
  const half = N / 2;
  let off = 0;                    // keeps consecutive grains phase-continuous at the
  for (let i = 0; i < nF; i++){   // shifted rate so the pitch shift actually lands
    const o = i * H, ctr = o + half;
    if (Math.abs(off) > 1600) off = 0;                   // re-center, masked by overlap
    // ratio: target from THIS frame, detected pitch from the frame actually read
    const ri = Math.min(nF - 1, Math.max(0, Math.round((ctr + off - half) / H)));
    const fD = f[ri] > 0 ? f[ri] : f[i];
    const r = fTarg[i] > 0 && fD > 0                     // ±13 st safety bound; the
      ? Math.min(2.13, Math.max(0.47, fTarg[i] / fD))    // note cap lives in step 4
      : 1;
    for (let n = 0; n < N; n++){
      const sp = ctr + off + (n - half) * r;
      const s0 = Math.floor(sp);
      if (s0 < 0 || s0 + 1 >= x.length) continue;
      const fr = sp - s0;
      out[o + n] += win[n] * (x[s0] * (1 - fr) + x[s0 + 1] * fr);
      norm[o + n] += win[n];
    }
    off += H * (r - 1);
  }
  for (let n = 0; n < x.length; n++)
    out[n] = norm[n] > 1e-4 ? out[n] / norm[n] : x[n];

  let voicedCnt = 0, bigJumps = 0;                       // diagnostics
  for (let i = 0; i < nF; i++){
    if (midi[i] <= 0) continue;
    voicedCnt++;
    if (i > 0 && midi[i - 1] > 0 && Math.abs(midi[i] - midi[i - 1]) >= 7) bigJumps++;
  }
  window.__lastAnalysis = { f0raw, midi, fTarg, root, voiced: voicedCnt, bigJumps,
                            clamped, gapsFilled, wobbledRuns, wobbleStep };

  const ob = makeBuf(x.length, sr);
  ob.getChannelData(0).set(out);
  return ob;
};

/* =================== backing section detection ==================== */
function fft(re, im){                                    // in-place radix-2
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++){
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti;
        re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}
window.__sections = [];
async function detectSections(buf){
  const dur = buf.duration;
  if (dur < 25) return [];
  const sr = buf.sampleRate, x = toMono(buf);
  const F = 4096, hf = F / 2, nW = Math.floor(dur);
  const hann = new Float32Array(F);
  for (let n = 0; n < F; n++) hann[n] = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / F);
  const kLo = Math.max(1, Math.ceil(80 * F / sr));
  const kHi = Math.min(hf - 1, Math.floor(2000 * F / sr));
  const re = new Float32Array(F), im = new Float32Array(F);
  const chromas = [], rms = [];
  for (let w = 0; w < nW; w++){                          // 1 s windows
    const c = Math.round((w + 0.5) * sr);
    let e = 0;
    for (let n = 0; n < F; n++){
      const idx = c - hf + n;
      const v = idx >= 0 && idx < x.length ? x[idx] : 0;
      re[n] = v * hann[n]; im[n] = 0; e += v * v;
    }
    rms.push(Math.sqrt(e / F));
    fft(re, im);
    const ch = new Float32Array(12);
    for (let k = kLo; k <= kHi; k++){
      const pc = ((Math.round(69 + 12 * Math.log2(k * sr / F / 440)) % 12) + 12) % 12;
      ch[pc] += Math.hypot(re[k], im[k]);
    }
    let n2 = 0;
    for (let p = 0; p < 12; p++) n2 += ch[p] * ch[p];
    n2 = Math.sqrt(n2) || 1;
    for (let p = 0; p < 12; p++) ch[p] /= n2;
    chromas.push(ch);
    if ((w & 31) === 31) await new Promise(r => setTimeout(r));  // keep UI responsive
  }
  const maxR = Math.max(...rms) || 1;
  const nov = [0];                                       // novelty curve
  for (let i = 1; i < nW; i++){
    let dot = 0;
    for (let p = 0; p < 12; p++) dot += chromas[i - 1][p] * chromas[i][p];
    nov.push((1 - dot) + 2 * Math.abs(rms[i] - rms[i - 1]) / maxR);
  }
  const sm = nov.map((_, i) =>
    (nov[Math.max(0, i - 1)] + nov[i] + nov[Math.min(nW - 1, i + 1)]) / 3);
  const thr = [...sm].sort((a, b) => a - b)[Math.floor(sm.length * 0.6)];
  const cand = [];
  for (let i = 1; i < nW - 1; i++)
    if (sm[i] > thr && sm[i] >= sm[i - 1] && sm[i] >= sm[i + 1]) cand.push(i);
  cand.sort((a, b) => sm[b] - sm[a]);
  const bounds = [0];
  for (const c of cand){
    if (bounds.length >= 12) break;
    if (bounds.every(b => Math.abs(b - c) >= 8)) bounds.push(c);
  }
  bounds.sort((a, b) => a - b);
  while (bounds.length > 1 && dur - bounds[bounds.length - 1] < 5) bounds.pop();
  const secs = bounds.map((b, i) => {                    // per-section stats
    const end = i + 1 < bounds.length ? bounds[i + 1] : nW;
    const mc = new Float32Array(12);
    let mr = 0, cnt = 0;
    for (let w = b; w < end; w++){
      for (let p = 0; p < 12; p++) mc[p] += chromas[w][p];
      mr += rms[w]; cnt++;
    }
    cnt = cnt || 1;
    for (let p = 0; p < 12; p++) mc[p] /= cnt;
    return { start: b, mc, mr: mr / cnt };
  });
  let star = 0, bs = -1;                                 // chorus = loud + repeated
  for (let i = 0; i < secs.length; i++){
    let sim = 0;
    for (let j = 0; j < secs.length; j++){
      if (j === i) continue;
      let d = 0;
      for (let p = 0; p < 12; p++) d += secs[i].mc[p] * secs[j].mc[p];
      sim += d;
    }
    if (secs.length > 1) sim /= secs.length - 1;
    const sc = secs[i].mr / maxR + sim;
    if (sc > bs){ bs = sc; star = i; }
  }
  return secs.map((s, i) => ({ start: s.start, isChorus: i === star }));
}

  backLane.querySelectorAll('.secchip').forEach(e => e.remove());

window.__mixdown = async function(){
  const dur = Math.max(0.1, mixDur());
  const oc = new OfflineAudioContext(2, Math.ceil(dur * 44100), 44100);
  buildGraph(oc, oc.destination, 0);

function encodeWav(buf){                                 // 16-bit PCM WAV
  const nCh = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length;
  const bytes = 44 + len * nCh * 2;
  const dv = new DataView(new ArrayBuffer(bytes));
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, nCh, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * nCh * 2, true); dv.setUint16(32, nCh * 2, true);
  dv.setUint16(34, 16, true); wstr(36, 'data'); dv.setUint32(40, len * nCh * 2, true);
  const chans = [];
  for (let c = 0; c < nCh; c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++)
    for (let c = 0; c < nCh; c++){
      const v = Math.max(-1, Math.min(1, chans[c][i]));
      dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
      o += 2;
    }
  return dv.buffer;
}

$('saveBtn').onclick = async () => {

};

/* ========================== video export ========================== */
let exporting = null;                                    // {rec, srcs, raf, timer, done}
const VW = 1080, VH = 1920, COLW = 170, VROWH = 150, VPPS = 110;
function vRoundRect(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function vPeakStrip(g, p, x0, y, w, h, color){           // draw from precomputed bins
  g.fillStyle = color;

  for (let x = xa; x < xb; x += 3){
    const b = Math.min(p.length - 1, Math.floor((x - x0) / w * p.length));
    const amp = Math.max(2, p[b] * h * 0.48);
    g.fillRect(x, y + h / 2 - amp, 2, amp * 2);

}

  g.beginPath(); g.rect(COLW, topY - 70, laneW, 70 + rows.length * VROWH); g.clip();
  g.textAlign = 'left'; g.font = '28px sans-serif';      // scrolling ruler
  for (let s = Math.max(0, Math.floor(t - phX / VPPS)); s <= Math.ceil(t + (VW - phX) / VPPS); s++){
    const x = originX + s * VPPS;
    g.fillStyle = '#4a4a58'; g.fillRect(x, topY - 22, 2, 22);
    g.fillStyle = '#8a8a96'; g.fillText(String(s), x + 8, topY - 34);
  }
  rows.forEach((r, ri) => {
    const y = topY + ri * VROWH;
    g.fillStyle = '#1d1d24'; g.fillRect(COLW, y + VROWH - 2, laneW, 2);
    if (r.type === 'back'){
      vPeakStrip(g, peaks.get(backing), originX, y + 12, backing.duration * VPPS, VROWH - 24, '#ff7a1a');
    } else {
      const tr = r.t, x0 = originX + tr.start * VPPS, w = tr.buf.duration * VPPS;
      g.fillStyle = tr.color + '30'; g.strokeStyle = tr.color; g.lineWidth = 3;
      vRoundRect(g, x0, y + 12, w, VROWH - 24, 20); g.fill(); g.stroke();
      vPeakStrip(g, peaks.get(tr.buf), x0, y + 18, w, VROWH - 36, lighten(tr.color, 0.45));
    }
  });
  g.restore();
  g.shadowColor = 'rgba(255,255,255,.7)'; g.shadowBlur = 16;  // fixed playhead
  g.fillStyle = '#fff'; g.fillRect(phX - 1.5, topY - 50, 3, rows.length * VROWH + 50);
  g.shadowBlur = 0;
  rows.forEach((r, ri) => {                              // static left column
    const cx = COLW / 2, cy = topY + ri * VROWH + VROWH / 2, rad = 52;
    g.beginPath(); g.arc(cx, cy, rad, 0, 7);
    if (r.type === 'back'){
      g.strokeStyle = '#ff7a1a'; g.lineWidth = 5; g.stroke();
      g.fillStyle = '#ff7a1a'; g.font = '52px sans-serif'; g.textAlign = 'center';
      g.fillText('♫', cx, cy + 18);
    } else if (imgs.has(r.t)){
      g.save(); g.clip();
      g.drawImage(imgs.get(r.t), cx - rad, cy - rad, rad * 2, rad * 2);
      g.restore();
      g.strokeStyle = '#2a2a33'; g.lineWidth = 4; g.stroke();
    } else {
      g.strokeStyle = '#2a2a33'; g.lineWidth = 4; g.stroke();
      g.fillStyle = '#ff3b3b'; g.beginPath(); g.arc(cx, cy, 20, 0, 7); g.fill();
    }
  });
}
async function startExport(){
  if (mixDur() <= 0){ showErr('nothing to save yet — record something first'); return; }
  const c = ensureCtx();
  const cv = document.createElement('canvas');
  cv.width = VW; cv.height = VH;
  if (!cv.captureStream || typeof MediaRecorder === 'undefined'){
    showErr("video export isn't supported in this browser — screen-record your phone instead");
    return;
  }
  const g = cv.getContext('2d');
  const rows = [];
  if (backing) rows.push({ type: 'back' });
  for (const t of tracks) if (t.buf) rows.push({ type: 'voc', t });
  const imgs = new Map();                                // preload face photos
  await Promise.all(tracks.filter(t => t.buf && t.img).map(t => new Promise(res => {
    const im = new Image();
    im.onload = () => { imgs.set(t, im); res(); };
    im.onerror = () => res();
    im.src = t.img;
  })));
  const peaks = new Map();                               // 10 ms peak bins per buffer
  const mkPeaks = buf => {
    const d = buf.getChannelData(0), bl = Math.max(1, Math.round(buf.sampleRate * 0.01));
    const p = new Float32Array(Math.ceil(d.length / bl));
    for (let b = 0; b < p.length; b++){
      let m = 0;
      const a0 = b * bl, a1 = Math.min(d.length, a0 + bl), st = Math.max(1, (a1 - a0) >> 5);
      for (let i = a0; i < a1; i += st){ const v = Math.abs(d[i]); if (v > m) m = v; }
      p[b] = m;
    }
    return p;
  };
  if (backing) peaks.set(backing, mkPeaks(backing));
  for (const t of tracks) if (t.buf) peaks.set(t.buf, mkPeaks(t.buf));
  let dur = mixDur();
  let lastVocalEnd = 0;                                  // stop soon after vocals end
  for (const t of tracks) if (t.buf) lastVocalEnd = Math.max(lastVocalEnd, t.start + t.buf.duration);
  if (lastVocalEnd > 0) dur = Math.min(dur, lastVocalEnd + 1.0);
  dur = Math.min(dur, window.__exportCap || Infinity);
  const msDest = c.createMediaStreamDestination();       // audible + captured
  const fan = c.createGain();
  fan.connect(c.destination); fan.connect(msDest);
  const stream = new MediaStream([
    ...cv.captureStream(30).getVideoTracks(),
    ...msDest.stream.getAudioTracks()
  ]);
  const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1',
    'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m));
  if (!mime){
    showErr("video export isn't supported in this browser — screen-record your phone instead");
    return;
  }
  let rec;
  try{ rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 }); }
  catch(_){
    showErr("video export isn't supported in this browser — screen-record your phone instead");
    return;
  }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const cancelled = exporting && exporting.cancelled;
    if (!cancelled && chunks.length){
      const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      window.__lastExport = { size: blob.size, mime };
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'autotune-trend.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    exporting = null;
    $('vidBtn').textContent = '🎬 Video';
    $('playBtn').disabled = false; $('saveBtn').disabled = false;
  };
  if (playing) stopPlayback();
  const srcs = buildGraph(c, fan, 0);                    // own graph and clock —
  const t0c = c.currentTime;                             // normal playhead untouched
  exporting = { rec, srcs, raf: 0, timer: 0, done: false, cancelled: false };
  rec.start(250);
  $('playBtn').disabled = true; $('saveBtn').disabled = true;
  exporting.timer = setTimeout(() => stopExport(false), (dur + 0.4) * 1000);
  const draw = () => {
    if (!exporting || exporting.rec !== rec) return;
    const t = Math.min(dur, c.currentTime - t0c);
    drawExportFrame(g, t, rows, imgs, peaks);
    $('vidBtn').textContent = '🎬 ' + Math.round(t / dur * 100) + '%';
    if (c.currentTime - t0c >= dur){ stopExport(false); return; }  // audio clock ends it
    exporting.raf = requestAnimationFrame(draw);
  };
  draw();
}
function stopExport(cancel){
  const ex = exporting;
  if (!ex || ex.done) return;
  ex.done = true; ex.cancelled = cancel;
  cancelAnimationFrame(ex.raf);
  clearTimeout(ex.timer);
  for (const s of ex.srcs){ try{ s.stop(); }catch(_){} }
  try{ ex.rec.stop(); }
  catch(_){
    exporting = null;
    $('vidBtn').textContent = '🎬 Video';
    $('playBtn').disabled = false; $('saveBtn').disabled = false;
  }
}
$('vidBtn').onclick = () => {
  ensureCtx();
  if (exporting){ stopExport(true); return; }            // tap mid-render = cancel
  if (recState) return;
  startExport();
};

/* ============================== init ============================== */
updateTL();
setPlayheadUI();
</script>
